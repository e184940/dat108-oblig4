<!DOCTYPE html>
<html lang="no">
<head>
	<meta charset="UTF-8" />
	<link href="simple.css" rel="stylesheet" type="text/css" />
<!-- <script src="js/myscript.js" defer></script>  -->
	<title>Påmelding</title>
</head>

<body>
	<h2>Påmelding</h2>
	<p style="color:red;">Påmeldingsdetaljer er ugyldige</p>
	<!-- Jeg har fjernet alt som har med form og input å gjøre,
		 siden dette er pensum. Her får dere sette opp skjemaet
		 selv. Lykke til.
	-->x
	<form id="regForm" action="/paameldt" method="post">
		<label>Fornavn
			<input name="fornavn" type="text">
		</label>
		<label>Etternavn
			<input name="etternavn" type="text">
		</label>
		<label>Mobil
			<input name="mobilnr" type="tel" pattern="[0-9 ]{8,20}">
		</label>
		<label>Passord
			<input name="passord1" type="password" minlength="8">
		</label>
		<label>Gjenta passord
			<input name="passord2" type="password" minlength="8">
		</label>
		<div>
			<label><input type="radio" name="kjonn" value="Mann"></label>
			<label><input type="radio" name="kjonn" value="Kvinne"></label>
		</div>
		<button type="submit" id="submitBtn" style="background-color:dodgerblue">Meld meg på</button>
	</form>


</body>
</html>
